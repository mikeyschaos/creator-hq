<!DOCTYPE html>
<html>

<head>

    <title>Creator HQ - {% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/control.css">

</head>

<body>

<div class="header">

    <h1>Creator HQ</h1>

    <div class="subtitle">
        Control Center
    </div>

</div>

<div class="layout">

    <div class="sidebar">

        <h3>Navigation</h3>

        <a class="nav-item {% if active_page == 'dashboard' %}active{% endif %}" href="/">
            🏠 Dashboard
        </a>

        <a class="nav-item {% if active_page == 'overview' %}active{% endif %}" href="/control">
            🏡 Overview
        </a>

        <a class="nav-item {% if active_page == 'goals' %}active{% endif %}" href="/control/goals">
            🎯 Goals
        </a>

        <a class="nav-item {% if active_page == 'channels' %}active{% endif %}" href="#">
            📺 Channels
        </a>

        <a class="nav-item {% if active_page == 'tips' %}active{% endif %}" href="/control/tips">
            💡 Creator Tips
        </a>

        <a class="nav-item {% if active_page == 'settings' %}active{% endif %}" href="#">
            ⚙ Dashboard
        </a>

        <a class="nav-item {% if active_page == 'system' %}active{% endif %}" href="#">
            🖥 System
        </a>

        <a class="nav-item {% if active_page == 'about' %}active{% endif %}" href="#">
            ℹ About
        </a>

    </div>

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</div>

<div class="footer">

    Creator HQ • RC3 Development

</div>

</body>

</html>
